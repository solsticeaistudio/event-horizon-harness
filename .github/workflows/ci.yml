name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Install bridge dependencies
        run: npm ci
      - name: Build Executor Attestation bridge
        run: npm run build:attestation-bridge
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Check published Firecracker evidence bytes
        working-directory: docs/evidence/artifacts/2026-10-10
        run: sha256sum -c linux-isolation.json.sha256
      - name: Verify published Firecracker evidence signatures and chains
        run: python scripts/verify_linux_isolation.py docs/evidence/artifacts/2026-10-10/linux-isolation.json
      - name: Lint Python sources
        run: python scripts/lint_python.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Kill real Linux gateway subprocesses at five effect checkpoints
        run: |
          python scripts/run_effect_crash_campaign.py --backend sqlite --report "$RUNNER_TEMP/ehh-effect-crash.json"
          python scripts/verify_effect_crash_campaign.py "$RUNNER_TEMP/ehh-effect-crash.json"
      - name: Publish signed host-process SIGKILL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ehh-effect-crash-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ehh-effect-crash.json
            ${{ runner.temp }}/ehh-effect-crash.json.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Attack actual trusted gateway process over Unix sockets
        run: python scripts/run_gateway_socket_campaign.py --report "$RUNNER_TEMP/ehh-gateway-attack.json"
      - name: Publish actual-gateway attack outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ehh-gateway-attack-${{ github.run_id }}
          path: ${{ runner.temp }}/ehh-gateway-attack.json
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise independent-process signer against adversarial coordinator
        run: python scripts/run_isolated_authority_lab.py --report "$RUNNER_TEMP/ehh-coordinator-isolation.json"
      - name: Attack signer separation under six real distinct Linux UIDs
        run: |
          sudo -n "$(command -v python)" scripts/run_isolated_authority_lab.py \
            --distinct-uids --report "$RUNNER_TEMP/ehh-coordinator-isolation-uids.json"
      - name: Publish coordinator-compromise results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ehh-coordinator-isolation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ehh-coordinator-isolation.json
            ${{ runner.temp }}/ehh-coordinator-isolation-uids.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify fixed capability vectors
        run: python scripts/verify_capability_vectors.py

  typescript:
    name: TypeScript / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Build all workspaces
        run: npm run build
      - name: Type check all workspaces
        run: npm run typecheck
      - name: Run TypeScript tests
        run: npm run test:typescript

  integration:
    name: Integration and repository policy
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Clean installs
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Build integration dependencies
        run: npm run build
      - name: Run complete public demonstration
        run: python -m event_horizon.public_demo --workdir "$RUNNER_TEMP/event-horizon-integration" --artifacts-dir "$RUNNER_TEMP/event-horizon-artifacts"
      - name: Export signed adversarial observations
        run: |
          python -m event_horizon.adversarial_boundary \
            --workdir "$RUNNER_TEMP/eh-adversarial" \
            --output "$RUNNER_TEMP/eh-adversarial/report.json"
      - name: Independently verify adversarial evidence bundle
        run: python scripts/verify_adversarial_boundary.py "$RUNNER_TEMP/eh-adversarial/report.json"
      - name: Publish synthetic adversarial evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eh-adversarial-evidence
          path: |
            ${{ runner.temp }}/eh-adversarial/report.json
            ${{ runner.temp }}/eh-adversarial/external-evidence/events.jsonl
          retention-days: 7
      - name: Verify cross-language remote replay protocol
        run: python scripts/verify_remote_replay_interop.py
      - name: Verify generated evidence chain
        run: python scripts/verify_evidence_chain.py "$RUNNER_TEMP/event-horizon-integration/external-evidence/events.jsonl"
      - name: Verify generated containment certificate
        run: python scripts/verify_certificate.py "$RUNNER_TEMP/event-horizon-artifacts/latest-containment-certificate.json" --trusted-key "$RUNNER_TEMP/event-horizon-artifacts/latest-certificate-signer-public.pem"
      - name: Verify selected fixed vectors
        run: python scripts/verify_capability_vectors.py test-vectors/valid-capability.json test-vectors/replayed-capability.json test-vectors/unknown-field.json test-vectors/invalid-signature.json
      - name: Enforce immutable GitHub Actions references
        run: python scripts/check_action_sha_pins.py
      - name: Enforce tracked-artifact and secret policy
        run: python scripts/check_repository_policy.py
