name: literature-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  review-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir --only-binary :all: -e .
      - run: python scripts/check_literature_feed.py --live --output artifacts/literature-drift.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: literature-review-report
          path: artifacts/literature-drift.json
