name: EHH Adversarial Assurance Fuzz

on:
  pull_request:
    paths:
      - "scripts/ehh_fuzz_targets.py"
      - "scripts/run_ehh_fuzz.py"
      - "tests/test_ehh_fuzz_targets.py"
      - "src/event_horizon/protocol.py"
      - "src/event_horizon/canonical.py"
      - "src/event_horizon/broker.py"
      - "src/event_horizon/effect_boundary.py"
      - "src/event_horizon/trusted_effect_gateway.py"
      - "pyproject.toml"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ehh_fuzz_targets.py"
      - "scripts/run_ehh_fuzz.py"
      - "src/event_horizon/protocol.py"
      - "src/event_horizon/canonical.py"
      - "src/event_horizon/broker.py"
      - "src/event_horizon/effect_boundary.py"
      - "src/event_horizon/trusted_effect_gateway.py"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance-fuzz:
    name: Four bounded coverage-guided Python targets
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned research fuzz dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[test,fuzz]"
      - name: Reproduce corpus and structured rejection cases
        run: |
          python scripts/run_ehh_fuzz.py --target all --smoke \
            --iterations 120 --report-dir "$RUNNER_TEMP/ehh-fuzz/smoke"
          python -m unittest tests.test_ehh_fuzz_targets -v
      - name: Coverage-guided Atheris/libFuzzer four-target campaign
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          for target in frame canonical capability gateway; do
            echo "Running coverage-guided target: $target"
            python scripts/run_ehh_fuzz.py --target "$target" \
              --seconds 15 --report-dir "$RUNNER_TEMP/ehh-fuzz/coverage"
          done
      - name: Publish reproducible smoke, corpus and crash inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ehh-assurance-fuzz-${{ github.run_id }}
          path: ${{ runner.temp }}/ehh-fuzz/
          if-no-files-found: warn
          retention-days: 14
