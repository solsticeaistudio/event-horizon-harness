[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "event-horizon-harness"
version = "0.4.0"
description = "Compromise-tolerant authority containment harness for autonomous agents"
requires-python = ">=3.11"
authors = [{name = "Justin Meister / Solstice AI Studio"}]
license = {text = "Proprietary research prototype"}
dependencies = [
    "cryptography==46.0.3",
    "cffi==2.1.0",
    "pycparser==3.0",
]

[project.optional-dependencies]
test = ["hypothesis==6.160.0", "requests==2.32.5"]
http = ["requests==2.32.5"]

[project.scripts]
event-horizon-demo = "event_horizon.public_demo:main"
event-horizon-process-demo = "event_horizon.process_demo:main"
event-horizon-adversarial-demo = "event_horizon.adversarial_demo:main"
eh-verify-denial = "event_horizon.denial_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
